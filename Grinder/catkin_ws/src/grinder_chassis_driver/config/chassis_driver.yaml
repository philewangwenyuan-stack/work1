# 串口设备路径（底盘驱动与电机控制器通信口）
port: /dev/ttyS0
# 串口波特率
baudrate: 19200
# Modbus 从站 ID
slave_id: 1
# 每次 Modbus 读写超时时间（秒）
timeout: 0.1
# 状态轮询频率（Hz）
poll_rate_hz: 20.0
# 指令超时保护时间（秒），超过后可触发停机保护
command_timeout: 5
# 写入后是否进行回读校验
write_verify: false
# 通信失败最大重试次数
max_retries: 3
# 通讯异常达到重试阈值后是否触发安全停机（回零并全量写寄存器）
enable_safe_stop_on_comm_error: false
# 指令超时后是否立即停机
stop_on_timeout: true
# 节点启动时是否先下发零速，防止误动作
startup_zero_output: true

# 左轮速度寄存器最小值（驱动原始单位）
left_speed_min: -32768
# 左轮速度寄存器最大值（驱动原始单位）
left_speed_max: 32767
# 右轮速度寄存器最小值（驱动原始单位）
right_speed_min: -32768
# 右轮速度寄存器最大值（驱动原始单位）
right_speed_max: 32767
# 磨盘速度寄存器最小值（驱动原始单位）
disc_speed_min: -32768
# 磨盘速度寄存器最大值（驱动原始单位）
disc_speed_max: 32767
# 磨盘速度每个控制周期最大变化量（驱动原始单位），避免恢复时电流冲击
disc_speed_max_step: 200
# 是否启用磨盘速度斜坡限幅；true 时磨盘速度会按 disc_speed_max_step 逐步变化
enable_disc_speed_ramp_limit: true

# 相邻两次下发速度的最大变化量（rpm），用于抑制突变抖动
max_cmd_step_rpm: 50
# 是否启用速度斜坡限幅（false 时直接下发目标轮速）
enable_cmd_ramp_limit: false
# 手动遥控最大轮速（rpm，供调度读取；上位机仅发送百分比 speed_ratio）
manual_drive_max_wheel_speed: 600
# 手动轮速输入零点死区（rpm），小于等于该值按 0 处理
manual_wheel_deadband_rpm: 30
# 手动轮速输入迟滞-进入阈值（rpm），从静止到运动需达到该值
manual_wheel_hyst_enter_rpm: 60
# 手动轮速输入迟滞-退出阈值（rpm），从运动到静止降到该值以下
manual_wheel_hyst_exit_rpm: 30
# 回读速度允许偏差（驱动原始单位）
#max_echo_deviation: 200
max_echo_deviation: 2000
# 连续回读异常达到该次数后触发容错
#max_echo_failures: 2
max_echo_failures: 20
# 连续错误时的安全停机触发间隔（秒）
#safe_stop_on_error_interval: 1.0
safe_stop_on_error_interval: 2.0
# 是否开启 485 原始收发日志（单独文件）
rs485_raw_log_enabled: false
# 485 原始收发日志文件路径（开启后按行追加）
rs485_raw_log_file: temp/chassis_rs485_raw.log

# 是否启用 /cmd_vel 转轮速功能
cmd_vel_enabled: true
# 订阅的速度话题名
cmd_vel_topic: /cmd_vel
# 任务导航使能默认值（false: 忽略 /cmd_vel；true: 处理 /cmd_vel）
task_enable_default: false

# 定位看门狗：定位质量异常时接管底盘，阻断自动导航速度，并尝试安全蠕动恢复
localization_watchdog_enabled: true
# Aurora 系统状态话题，仅用于显示；默认不直接作为锁车条件
localization_system_status_topic: /slamware_ros_sdk_server_node/system_status
# Aurora 重定位状态话题，仅用于显示；默认不直接作为锁车条件
localization_relocalization_status_topic: /slamware_ros_sdk_server_node/relocalization_status
# 定位质量话题；看门狗默认只用这个话题做触发条件
localization_pose_quality_topic: /slamware_ros_sdk_server_node/pose_quality
# pose_quality 超过该时间未刷新则触发看门狗
localization_pose_quality_timeout_sec: 1.0
# true 时 pose_quality=UNKNOWN 也触发看门狗
localization_pose_quality_block_unknown: true
# true 时 pose_quality=WARN 也触发看门狗并进入蠕动恢复
localization_pose_quality_warn_glide: true
# pose_quality 已经融合 system/relocalization/covariance；默认不再重复用 system_status 锁车
localization_watchdog_use_system_status: false
# pose_quality 已经融合 system/relocalization/covariance；默认不再重复用 relocalization_status 锁车
localization_watchdog_use_relocalization_status: false
# 仅当启用 localization_watchdog_use_system_status 时生效：system_status 超时锁车
localization_status_timeout_sec: 1.0
# 看门狗锁定时周期发布 cancel，避免 move_base 按坏定位继续发速度
localization_watchdog_cancel_topic: /move_base/cancel
# cancel 发布周期
localization_watchdog_cancel_period_sec: 1.0
# 看门狗状态输出话题
localization_watchdog_status_topic: /chassis/localization_watchdog_status
# true 时定位恢复后自动解锁；false 时需要调用 localization_watchdog_release_service 手动解锁
localization_watchdog_auto_release: true
# 手动释放看门狗服务；仅在 auto_release=false 或需要人工强制释放时使用
localization_watchdog_release_service: /chassis/localization_watchdog_release
# 定位恢复时是否恢复锁定前轮速；默认 false，避免恢复瞬间继续旧速度
localization_watchdog_restore_motion_on_release: false
# 定位恢复时是否恢复锁定前磨盘速度；默认 false，由任务逻辑重新下发，且磨盘斜坡限幅会保护电流
localization_watchdog_restore_disc_on_release: false
# true 时看门狗一锁定就停磨盘；默认 false，因为当前底盘“磨盘不转车动不了”
localization_watchdog_stop_disc_on_lock: false
# 蠕动时磨盘降速比例；0.5 表示使用锁定前磨盘速度的一半
localization_watchdog_disc_speed_scale: 0.5
# 是否允许看门狗锁定期间低速直行蠕动
localization_recovery_glide_enabled: true
# 不能安全蠕动时是否停磨盘；true 表示停车时磨盘也停
localization_watchdog_stop_disc_when_not_gliding: true
# 蠕动直行速度（m/s）；左右轮等幅，不叠加角速度
localization_recovery_glide_speed_mps: 0.05
# 单次看门狗锁定最多蠕动距离（m）
localization_recovery_max_distance_m: 0.30
# 单次看门狗锁定最多蠕动时间（s）
localization_recovery_max_duration_sec: 10.0
# 蠕动避障使用的 LaserScan 话题；该话题必须与机器人前方方向一致
localization_recovery_scan_topic: /scan
# scan 超过该时间未刷新则禁止蠕动并停车
localization_recovery_scan_timeout_sec: 0.5
# 前方避障扇区角度（deg）；45 表示检查 -22.5deg 到 +22.5deg
localization_recovery_front_sector_deg: 45.0
# 前方扇区内最近障碍距离小于等于该值时禁止蠕动并停车
localization_recovery_obstacle_stop_m: 0.40
# 轮距（米），用于角速度换算
cmd_vel_wheel_track_m: 0.79
# 轮半径（米），用于线速度换算
cmd_vel_wheel_radius_m: 0.15
# 减速比（电机转速 -> 车轮转速）
cmd_vel_gear_ratio: 60.0
# 速度缩放系数（整体增益）
cmd_vel_scale: 1.0
# 线速度上限（m/s）
cmd_vel_max_linear: 0.15
# 角速度上限（rad/s）
cmd_vel_max_angular: 0.15
# 输入线速度限幅（m/s）
cmd_vel_max_input_v: 0.15
# 输入角速度限幅（rad/s）
cmd_vel_max_input_w: 0.15
# 换算后的轮速绝对值上限（rpm）
cmd_vel_max_abs_wheel_rpm: 3000.0
# 线速度死区（小于该值按 0 处理）
cmd_vel_deadband_linear: 0.0
# 角速度死区（小于该值按 0 处理）
cmd_vel_deadband_angular: 0.0
# 指令源保持时间（秒），超过后可回落到默认源
cmd_source_hold_sec: 0.2

# 手动接管：开启后忽略 /cmd_vel，让人工轮速命令优先
manual_override_enabled: true
manual_override_topic: /chassis/manual_override
manual_override_service: /chassis/set_manual_override
# true 时开启手动接管会 cancel move_base；默认 false，便于人工绕障后继续原导航目标
manual_override_cancel_navigation: false
# true 时手动轮速/磨盘命令可绕过定位看门狗
manual_override_bypass_localization_watchdog: true

# 轮系方向修正：
# -1 表示该轮方向取反，1 表示不取反
drive_left_sign: -1
# 右轮方向修正
drive_right_sign: -1
# true 时先交换左右轮，再应用方向修正
drive_swap_lr: false
cmd_vel_drive_left_sign: 1
cmd_vel_drive_right_sign: 1
cmd_vel_drive_swap_lr: false


# 是否启用 /cmd_vel 平滑滤波：
# true 表示底盘驱动在把 /cmd_vel 转成左右轮速前，会先做死区、加速度限制和转向反向确认。
cmd_vel_filter_enabled: False

# 线速度变化率限制，单位 m/s^2：
# 0.20 表示线速度每秒最多变化 0.20 m/s。
# 例如控制周期 0.1s 时，linear.x 每次最多变化约 0.02 m/s。
cmd_vel_filter_linear_accel: 0.20

# 角速度变化率限制，单位 rad/s^2：
# 0.20 表示角速度每秒最多变化 0.20 rad/s。
# 例如控制周期 0.1s 时，angular.z 每次最多变化约 0.02 rad/s。
cmd_vel_filter_angular_accel: 0.20

# 角速度死区，单位 rad/s：
# |angular.z| 小于 0.02 时直接当作 0，避免很小的纠偏指令让底盘左右抖。
cmd_vel_filter_angular_deadband: 0.005

# 角速度换向确认次数：
# 当 angular.z 想从正转直接切到反转，或从反转切到正转时，
# 需要连续 2 次收到同方向的新指令才允许真正换向。
# 这样可以过滤一帧左、一帧右的抖动。
cmd_vel_filter_sign_confirm_count: 2

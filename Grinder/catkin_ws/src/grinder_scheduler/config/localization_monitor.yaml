slamware_pose_topic: /slamware_ros_sdk_server_node/robot_pose
amcl_pose_topic: /localization_shadow/amcl_pose
system_status_topic: /slamware_ros_sdk_server_node/system_status
relocalization_status_topic: /slamware_ros_sdk_server_node/relocalization_status
initialpose_topic: /localization_shadow/initialpose
healthy_topic: /localization_monitor/healthy
fault_topic: /localization_monitor/fault
localization_monitor_fault_topic: /localization_monitor/fault
expected_frame: map

localization_monitor_check_hz: 10.0
localization_monitor_status_publish_hz: 2.0
localization_monitor_diagnostics_publish_hz: 1.0
localization_monitor_action_mode: warn_only
localization_monitor_pose_timeout_sec: 1.0

localization_monitor_warn_position_m: 0.30
localization_monitor_fault_position_m: 0.60
localization_monitor_clear_position_m: 0.35
localization_monitor_warn_yaw_deg: 10.0
localization_monitor_fault_yaw_deg: 20.0
localization_monitor_clear_yaw_deg: 12.0
localization_monitor_warn_hold_sec: 1.0
localization_monitor_fault_hold_sec: 2.0
localization_monitor_clear_hold_sec: 3.0
localization_monitor_amcl_max_position_stddev_m: 1.5
localization_monitor_amcl_max_yaw_stddev_rad: 1.0

initialize_amcl_on_startup: true
initialize_amcl_on_relocalization_succeed: true
initialpose_startup_delay_sec: 0.5
initialpose_repeat_count: 3
initialpose_repeat_interval_sec: 0.2
initialpose_covariance_xy_m: 0.25
initialpose_covariance_yaw_deg: 10.0
